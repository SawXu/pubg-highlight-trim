[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Offline model and release assurance tools"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
pubg-ocr-engine = { path = "../ocr_engine" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "2.12"
zip = "2"
serde_yaml = "0.9"
prost = "0.13"
image = "0.25"
csv = "1"
