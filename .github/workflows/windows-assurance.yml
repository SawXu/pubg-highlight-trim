name: Windows assurance

on:
  workflow_call:
    inputs:
      cold_cache:
        type: boolean
        default: false
      cargo_timings:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows-assurance:
    runs-on: windows-latest
    env:
      # Match the formal release build so tests reuse compatible Cargo outputs.
      RUSTFLAGS: "-C link-args=/DELAYLOAD:directml.dll -C link-args=delayimp.lib"
      # Hosted runners have no GPU: real release inference must prove that the
      # default auto/DirectML request falls back to working CPU OCR, not a mock.
      PUBG_OCR_REQUIRE_CPU_FALLBACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-windows-setup
        with:
          cache-role: assurance-release-cli-directml-delay-load
          cold-cache: ${{ inputs.cold_cache || false }}
      - name: Restore pinned FFmpeg archive
        id: ffmpeg-cache
        if: ${{ !inputs.cold_cache }}
        uses: actions/cache@v4
        with:
          path: vendor/ffmpeg-cache
          key: ffmpeg-windows-x64-${{ hashFiles('scripts/ffmpeg-lock.json') }}
      - name: Restore pinned OCR models
        id: model-cache
        if: ${{ !inputs.cold_cache }}
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ocr_models
          key: ocr-models-${{ hashFiles('rust/ocr_engine/models/pp_ocrv6_medium.json') }}
      - name: Prepare required media test tools
        shell: powershell
        run: |
          ./scripts/download_ffmpeg.ps1
          $tools = Join-Path $env:GITHUB_WORKSPACE 'vendor\ffmpeg'
          foreach ($name in @('ffmpeg.exe', 'ffprobe.exe')) {
            $binary = Join-Path $tools $name
            if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
              throw "Required media test tool is missing: $binary"
            }
            & $binary -version
            if ($LASTEXITCODE -ne 0) { throw "Required media test tool failed: $binary" }
          }
          "PUBG_HIGHLIGHT_TRIM_FFMPEG_DIR=$tools" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build formal application, OCR engine and xtask (Cargo timings)
        shell: powershell
        run: ./scripts/build_rust_release.ps1
      - name: Release reuse integrity contract
        shell: powershell
        run: ./scripts/tests/test_release_reuse.ps1
      - name: Verify pinned model source, hashes, dictionary and ONNX format
        shell: powershell
        run: |
          if (-not (Select-String -Path rust/Cargo.toml -Pattern 'xtask' -Quiet)) {
            throw "Rust xtask is not integrated in rust/Cargo.toml yet (#68 dependency); model assurance is intentionally blocked."
          }
          New-Item -ItemType Directory -Path $env:RUNNER_TEMP\ocr_models -Force | Out-Null
          & rust/target/release/xtask.exe download --output-dir $env:RUNNER_TEMP\ocr_models
          if ($LASTEXITCODE -ne 0) { throw "Model provisioning failed" }
          & rust/target/release/xtask.exe verify --model-dir $env:RUNNER_TEMP\ocr_models --check-onnx --engine rust\target\release\ocr_engine.exe
      - name: Rust end-to-end OCR pipeline (real pinned models)
        shell: powershell
        env:
          PUBG_OCR_MODEL_DIR: ${{ runner.temp }}\ocr_models
          PUBG_HIGHLIGHT_TRIM_FFMPEG_DIR: ${{ github.workspace }}\vendor\ffmpeg
        run: cargo test --locked --manifest-path rust/Cargo.toml --release --features cli,directml --test end_to_end -- --ignored
      - name: Rust OCR inference smoke
        shell: powershell
        run: |
          & rust/target/release/xtask.exe onnx-smoke --model-dir $env:RUNNER_TEMP\ocr_models --engine rust\target\release\ocr_engine.exe
      - name: Rust real ROI event semantic parity
        shell: powershell
        env:
          PUBG_OCR_MODEL_DIR: ${{ runner.temp }}\ocr_models
        run: |
          New-Item -ItemType Directory -Path $env:RUNNER_TEMP\real-roi -Force | Out-Null
          & rust/target/release/xtask.exe real-roi --executable rust\target\release\ocr_engine.exe --model-dir $env:RUNNER_TEMP\ocr_models --fixture rust\ocr_engine\fixtures\real --output $env:RUNNER_TEMP\real-roi\roi.jsonl
          if ($LASTEXITCODE -ne 0) { throw "xtask real-roi semantic parity failed with exit code $LASTEXITCODE" }
      - name: Complete CLI fault, cache, provider and cancellation acceptance
        shell: powershell
        env:
          PUBG_OCR_MODEL_DIR: ${{ runner.temp }}\ocr_models
          PUBG_HIGHLIGHT_TRIM_FFMPEG_DIR: ${{ github.workspace }}\vendor\ffmpeg
        run: |
          cargo test --locked --manifest-path rust/Cargo.toml --release --features cli,directml --test application_e2e -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "CLI acceptance failed" }
          cargo test --locked --manifest-path rust/Cargo.toml --release --features cli,directml --test ocr_provider_e2e -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "Default auto fallback, provider cache and diagnostic acceptance failed" }
          cargo test --locked --manifest-path rust/Cargo.toml --release --features cli,directml --test dedupe_cli -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "Upstream overlapping-source batch acceptance failed" }
          cargo test --locked --manifest-path rust/Cargo.toml --release --features cli,directml --test nonfinite_summary -- --ignored
          if ($LASTEXITCODE -ne 0) { throw "Legacy explicit infinite-value wire compatibility failed" }
          cargo test --locked --manifest-path rust/Cargo.toml --release --features cli,directml --test preprocess -- --ignored
          if ($LASTEXITCODE -ne 0) { throw "Real ROI preprocessing acceptance failed" }
          cargo test --locked --manifest-path rust/Cargo.toml --release --features cli,directml --lib ppocr_cpu_smoke_test -- --ignored
          if ($LASTEXITCODE -ne 0) { throw "Real model CPU acceptance failed" }
          cargo test --locked --manifest-path rust/Cargo.toml --release -p xtask --features pubg-ocr-engine/cli,pubg-ocr-engine/directml --test retirement_contract bad_https_download -- --ignored
          if ($LASTEXITCODE -ne 0) { throw "Pinned HTTPS download failure safety failed" }
      - name: Windows bundle assurance
        shell: powershell
        run: ./scripts/build_windows.ps1 -SkipInstall -ModelDirectory "$env:RUNNER_TEMP\ocr_models" -ReleaseDirectory "rust\target\release"
      - name: Verify shipped license inventory and manifest coverage
        shell: powershell
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'dist\pubg-highlight-trim'
          $inventoryPath = Join-Path $bundle 'third_party\rust\INVENTORY.json'
          $manifestPath = Join-Path $bundle 'SUPPLY_CHAIN_MANIFEST.json'
          foreach ($path in @($inventoryPath, $manifestPath)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing release assurance file: $path" }
          }
          $inventory = Get-Content -LiteralPath $inventoryPath -Raw | ConvertFrom-Json
          if ($inventory.schema -ne 'pubg-highlight-trim/rust-licenses/v1') { throw "Unexpected license inventory schema" }
          if (-not $inventory.packages -or $inventory.packages.Count -lt 1) { throw "License inventory has no Cargo packages" }
          if (-not $inventory.notice_files -or $inventory.notice_files.Count -lt 1) { throw "License inventory has no pinned notice files" }
          foreach ($notice in $inventory.notice_files) {
            $noticePath = Join-Path $bundle ($notice.path -replace '/', '\\')
            if (-not (Test-Path -LiteralPath $noticePath -PathType Leaf)) { throw "Notice file is not shipped: $($notice.path)" }
            $actual = (Get-FileHash -LiteralPath $noticePath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne ([string]$notice.sha256).ToLowerInvariant()) { throw "Notice hash mismatch: $($notice.path)" }
          }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $paths = @($manifest.files | ForEach-Object { $_.path })
          foreach ($notice in $inventory.notice_files) {
            if ($paths -notcontains $notice.path) { throw "Supply-chain manifest does not cover notice: $($notice.path)" }
          }
          Write-Host "Verified $($inventory.packages.Count) Cargo packages and $($inventory.notice_files.Count) pinned notices are shipped and manifest-hashed."
      - name: Upload diagnostic Cargo timings
        if: ${{ always() && inputs.cargo_timings }}
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: rust/target/cargo-timings/
          retention-days: 7
          if-no-files-found: warn
      - name: Report cache and asset reuse
        if: always()
        shell: powershell
        run: |
          Write-Host "Assurance FFmpeg cache-hit=${{ steps.ffmpeg-cache.outputs.cache-hit }}; model cache-hit=${{ steps.model-cache.outputs.cache-hit }}; cold-cache=${{ inputs.cold_cache || false }}"
          "Assurance FFmpeg cache-hit=${{ steps.ffmpeg-cache.outputs.cache-hit }}; model cache-hit=${{ steps.model-cache.outputs.cache-hit }}; cold-cache=${{ inputs.cold_cache || false }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "Models and release binaries remain in this job: no target artifact transfer or second release build. See step durations for preparation, inference and packaging timings." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
