name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

jobs:
  assurance:
    uses: ./.github/workflows/windows-assurance.yml

  ui-checks:
    uses: ./.github/workflows/ui-checks.yml

  windows:
    needs: [assurance, ui-checks]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce clean no-Python release host
        shell: powershell
        run: |
          # This hosted runner is disposable. Remove distributions and py launcher;
          # PATH filtering alone is not accepted as a clean-host check.
          $roots = @("C:\hostedtoolcache\windows\Python", "C:\Python27", "C:\Python38", "C:\Python39", "C:\Python310", "C:\Python311", "C:\Python312", "C:\Python313")
          foreach ($root in $roots) {
            if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction Stop }
          }
          foreach ($launcher in @("$env:WINDIR\py.exe", "$env:WINDIR\pyw.exe")) {
            if (Test-Path -LiteralPath $launcher) { Remove-Item -LiteralPath $launcher -Force -ErrorAction Stop }
          }
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -and $_ -notmatch '(?i)python|windowsapps' }) -join ';'
          "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          foreach ($name in @('python', 'python3', 'py')) {
            if (Get-Command $name -ErrorAction SilentlyContinue) { throw "Python command remains on clean release host: $name" }
          }
          Write-Host "Confirmed python, python3 and py are unavailable before release build."

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Reject unsafe installer inputs without building
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\tests\test_installer_inputs.ps1

      - name: Install NSIS compiler for product builds
        shell: powershell
        run: |
          choco install nsis --version=3.11 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS provisioning failed.' }
          'C:\Program Files (x86)\NSIS' | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          'C:\Program Files\7-Zip' | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - name: Release entry trust and static payload contract tests
        shell: powershell
        run: |
          $env:PATH += ';C:\Program Files\7-Zip'
          ./scripts/tests/test_release_entry.ps1 -MakeNsis makensis

      - name: Build Native release and CLI bundle
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\release_windows.ps1

      - name: Package and verify the single Native release artifact
        shell: powershell
        run: |
          $native = 'dist\pubg-highlight-trim-native-ui'
          $cli = 'dist\pubg-highlight-trim-windows-x64.zip'
          $installer = Get-ChildItem -LiteralPath 'dist\release' -Filter '*-native-setup.exe' -File
          $manifest = 'build\installer-stage-native\installer-manifest.json'
          $distribution = 'build\installer-stage-native\distribution.json'
          foreach ($path in @($native, $cli, $manifest, $distribution)) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing Native release input: $path" }
          }
          if ($installer.Count -ne 1) { throw "Expected exactly one Native installer, found $($installer.Count)." }
          if (-not (Test-Path -LiteralPath (Join-Path $native 'pubg-highlight-trim-native-ui.exe'))) { throw 'Native executable is missing.' }
          if (-not (Test-Path -LiteralPath (Join-Path $native 'cli\pubg-highlight-trim.exe'))) { throw 'CLI bundle is missing from the Native artifact.' }
          $nativeZip = 'dist\pubg-highlight-trim-windows-x64-native.zip'
          Compress-Archive -Path (Join-Path $native '*') -DestinationPath $nativeZip -Force
          Copy-Item -LiteralPath $manifest, $distribution -Destination 'dist\release' -Force
          $files = @($nativeZip, $cli, $installer.FullName, 'dist\release\installer-manifest.json', 'dist\release\distribution.json', 'dist\release\release-evidence.json')
          foreach ($path in $files) { if (-not (Test-Path -LiteralPath $path)) { throw "Missing release product: $path" } }
          $lines = foreach ($path in $files) {
            $file = Get-Item -LiteralPath $path
            "$((Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($file.Name)"
          }
          $lines | Set-Content -LiteralPath 'dist\release\RELEASE-SHA256SUMS.txt' -Encoding ASCII

      - name: Verify Native and CLI archives contain no Python runtime names
        shell: powershell
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $forbidden = 'python|pyinstaller|paddle|paddlex|numpy|opencv'
          foreach ($archive in @('dist\pubg-highlight-trim-windows-x64-native.zip', 'dist\pubg-highlight-trim-windows-x64.zip')) {
            $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $archive))
            try {
              $hits = @($zip.Entries | Where-Object { $_.FullName -match $forbidden })
              if ($hits.Count -gt 0) { throw "Forbidden runtime names in $archive`: $($hits.FullName -join ', ')" }
            } finally { $zip.Dispose() }
          }

      - name: Upload the single Native release artifact
        uses: actions/upload-artifact@v4
        with:
          name: pubg-highlight-trim-windows-x64-native
          path: |
            dist/pubg-highlight-trim-windows-x64-native.zip
            dist/pubg-highlight-trim-windows-x64.zip
            dist/release/*-native-setup.exe
            dist/release/installer-manifest.json
            dist/release/distribution.json
            dist/release/SHA256SUMS.txt
            dist/release/RELEASE-SHA256SUMS.txt
            dist/release/release-evidence.json
          if-no-files-found: error

      - name: Record Native release limitations
        shell: powershell
        run: |
          '## Native Windows release artifact' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          'This artifact contains the Native executable, its CLI bundle, the Native installer, distribution and installer manifests, and SHA-256 checksums.' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          'Static extraction and hash checks do not prove installation, runtime, or Windows 10/11 VM lifecycle acceptance; release-evidence.json records these limitations.' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Publish Native release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Native Windows x64 release. Includes the Native executable and CLI bundle archive, the Native installer, manifests, and SHA-256 checksums.

            The Native UI has no browser runtime dependency. Static payload and hash checks are included; installation, runtime, and Windows 10/11 VM lifecycle acceptance remain documented in release-evidence.json.
          files: |
            dist/pubg-highlight-trim-windows-x64-native.zip
            dist/pubg-highlight-trim-windows-x64.zip
            dist/release/*-native-setup.exe
            dist/release/installer-manifest.json
            dist/release/distribution.json
            dist/release/SHA256SUMS.txt
            dist/release/RELEASE-SHA256SUMS.txt
            dist/release/release-evidence.json
