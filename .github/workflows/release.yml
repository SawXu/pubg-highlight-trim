name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  assurance:
    uses: ./.github/workflows/windows-assurance.yml

  windows:
    needs: assurance
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce clean no-Python release host
        shell: powershell
        run: |
          # This hosted runner is disposable. Remove distributions and py launcher;
          # PATH filtering alone is not accepted as a clean-host check.
          $roots = @("C:\hostedtoolcache\windows\Python", "C:\Python27", "C:\Python38", "C:\Python39", "C:\Python310", "C:\Python311", "C:\Python312", "C:\Python313")
          foreach ($root in $roots) {
            if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction Stop }
          }
          foreach ($launcher in @("$env:WINDIR\py.exe", "$env:WINDIR\pyw.exe")) {
            if (Test-Path -LiteralPath $launcher) { Remove-Item -LiteralPath $launcher -Force -ErrorAction Stop }
          }
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -and $_ -notmatch '(?i)python|windowsapps' }) -join ';'
          "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          foreach ($name in @('python', 'python3', 'py')) {
            if (Get-Command $name -ErrorAction SilentlyContinue) { throw "Python command remains on clean release host: $name" }
          }
          Write-Host "Confirmed python, python3 and py are unavailable before release build."

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build Windows bundle (Cargo + PowerShell; no Python)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\build_windows.ps1 -SkipInstall

      - name: Test Windows UI
        shell: powershell
        run: dotnet test ui\PubgHighlightTrim.Ui.Tests\PubgHighlightTrim.Ui.Tests.csproj --configuration Release

      - name: Add Windows SDK manifest tool to PATH
        shell: powershell
        run: |
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          $mt = Get-ChildItem -LiteralPath $sdkRoot -Filter mt.exe -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq "x64" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $mt) {
            throw "Could not find the x64 Windows SDK mt.exe under $sdkRoot"
          }
          $mt.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Using Windows SDK manifest tool: $($mt.FullName)"

      - name: Build Windows UI bundle (WPF layout and DPI checks)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\build_ui_windows.ps1 -SkipCliBuild

      - name: Verify release artifacts contain no Python runtime names
        shell: powershell
        run: |
          $forbidden = 'python|pyinstaller|paddle|paddlex|numpy|opencv'
          foreach ($archive in @('dist\pubg-highlight-trim-windows-x64.zip', 'dist\pubg-highlight-trim-ui-windows-x64.zip')) {
            if (-not (Test-Path -LiteralPath $archive)) { throw "Missing release archive: $archive" }
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $archive))
            try {
              $hits = @($zip.Entries | Where-Object { $_.FullName -match $forbidden })
              if ($hits.Count -gt 0) { throw "Forbidden Python/Paddle runtime names in $archive`: $($hits.FullName -join ', ')" }
            } finally { $zip.Dispose() }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pubg-highlight-trim-windows-x64
          path: dist/pubg-highlight-trim-windows-x64.zip

      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: pubg-highlight-trim-ui-windows-x64
          path: dist/pubg-highlight-trim-ui-windows-x64.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pubg-highlight-trim-windows-x64.zip
            dist/pubg-highlight-trim-ui-windows-x64.zip
