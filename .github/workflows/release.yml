name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build Windows bundle
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\build_windows.ps1

      - name: Test Windows UI
        shell: powershell
        run: dotnet test ui\PubgHighlightTrim.Ui.Tests\PubgHighlightTrim.Ui.Tests.csproj --configuration Release

      - name: Build Windows UI bundle
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\build_ui_windows.ps1 -SkipCliBuild

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pubg-highlight-trim-windows-x64
          path: dist/pubg-highlight-trim-windows-x64.zip

      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: pubg-highlight-trim-ui-windows-x64
          path: dist/pubg-highlight-trim-ui-windows-x64.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pubg-highlight-trim-windows-x64.zip
            dist/pubg-highlight-trim-ui-windows-x64.zip
