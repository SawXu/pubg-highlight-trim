name: Rust checks

on:
  # 05:00 Asia/Shanghai (UTC+8). Scheduled runs use the default branch (main)
  # and the same rust-quality job/cache as main pushes and pull requests.
  schedule:
    - cron: "0 21 * * *"
  pull_request:
    paths:
      - "rust/**"
      - "vendor/ppocr-rs/**"
      - ".github/actions/rust-windows-setup/**"
      - "scripts/**"
      - ".github/workflows/ocr-rust.yml"
      - ".github/workflows/windows-assurance.yml"
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "vendor/ppocr-rs/**"
      - ".github/actions/rust-windows-setup/**"
      - "scripts/**"
      - ".github/workflows/ocr-rust.yml"
      - ".github/workflows/windows-assurance.yml"

  workflow_dispatch:
    inputs:
      full_assurance:
        description: Run complete Windows assurance
        type: boolean
        default: false
      cold_cache:
        description: Bypass all cache restores and saves
        type: boolean
        default: false
      cargo_timings:
        description: Upload Cargo build timing reports
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-windows-setup
        with:
          cache-role: quality-all-features-debug-onnx-cli-directml
          cold-cache: ${{ inputs.cold_cache || false }}
      - name: Rust format
        shell: powershell
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Restore pinned FFmpeg archive
        id: ffmpeg-cache
        if: ${{ !inputs.cold_cache }}
        uses: actions/cache@v4
        with:
          path: vendor/ffmpeg-cache
          key: ffmpeg-windows-x64-${{ hashFiles('scripts/ffmpeg-lock.json') }}
      - name: Prepare required media test tools
        shell: powershell
        run: |
          ./scripts/download_ffmpeg.ps1
          "PUBG_HIGHLIGHT_TRIM_FFMPEG_DIR=$env:GITHUB_WORKSPACE\vendor\ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Rust tests (including required real media behaviors)
        shell: powershell
        run: cargo test --locked --manifest-path rust/Cargo.toml --all-features
      - name: Rust highlight planner contract
        shell: powershell
        run: cargo test --locked --manifest-path rust/Cargo.toml --features highlight-cli --test highlight_plan_cli
      - name: Rust optional OCR features
        shell: powershell
        run: |
          cargo check --locked --manifest-path rust/Cargo.toml --features onnx,cli
          if ($LASTEXITCODE -ne 0) { throw "ONNX/CLI check failed" }
          cargo check --locked --manifest-path rust/Cargo.toml --features directml
          if ($LASTEXITCODE -ne 0) { throw "DirectML check failed" }
      - name: Report cache status
        if: always()
        shell: powershell
        run: |
          Write-Host "Quality FFmpeg cache-hit=${{ steps.ffmpeg-cache.outputs.cache-hit }}; cold-cache=${{ inputs.cold_cache || false }}"
          "Quality FFmpeg cache-hit=${{ steps.ffmpeg-cache.outputs.cache-hit }}; cold-cache=${{ inputs.cold_cache || false }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  windows-assurance:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_assurance }}
    uses: ./.github/workflows/windows-assurance.yml
    with:
      cold_cache: ${{ inputs.cold_cache || false }}
      cargo_timings: ${{ inputs.cargo_timings || false }}

  # Retain the existing required-check name; require assurance only when requested.
  rust-and-windows-assurance:
    needs: [rust-quality, windows-assurance]
    if: always()
    runs-on: windows-latest
    steps:
      - name: Require all Rust assurance gates
        shell: powershell
        run: |
          $expectedAssurance = 'skipped'
          if ('${{ github.event_name == 'workflow_dispatch' && inputs.full_assurance }}' -eq 'true') {
            $expectedAssurance = 'success'
          }
          if ('${{ needs.rust-quality.result }}' -ne 'success' -or '${{ needs.windows-assurance.result }}' -ne $expectedAssurance) {
            throw "Quality must pass and Windows assurance must be $expectedAssurance"
          }
