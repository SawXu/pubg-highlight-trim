name: OCR Rust checks

on:
  pull_request:
    paths:
      - "rust/**"
      - "scripts/*ocr*"
      - "src/pubg_highlight_trim/rust_ocr.py"
      - "tests/**"
      - ".github/workflows/ocr-rust.yml"
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "scripts/*ocr*"
      - "src/pubg_highlight_trim/rust_ocr.py"
      - "tests/**"

jobs:
  rust-and-python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt
      - name: Rust format
        run: cargo fmt --manifest-path rust/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --manifest-path rust/Cargo.toml --lib
      - name: Rust optional OCR features
        run: |
          cargo check --manifest-path rust/Cargo.toml --features onnx,cli
          cargo check --manifest-path rust/Cargo.toml --features directml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python test dependencies
        run: python -m pip install -e . pytest opencv-contrib-python pyyaml onnx onnxruntime
      - name: Python tests
        run: python -m pytest -q
      - name: Download and verify pinned ONNX assets
        shell: pwsh
        run: |
          python scripts/download_ocr_models.py --output-dir $env:RUNNER_TEMP\ocr_models
          python scripts/verify_ocr_models.py --model-dir $env:RUNNER_TEMP\ocr_models --check-onnx
          python scripts/onnx_cpu_smoke.py --model-dir $env:RUNNER_TEMP\ocr_models
      - name: Rust ONNX CPU smoke
        shell: pwsh
        env:
          PUBG_OCR_MODEL_DIR: ${{ runner.temp }}\ocr_models
        run: cargo test --manifest-path rust/Cargo.toml --features onnx-test-runtime --lib -- --ignored
      - name: Real ROI Python-Rust comparison
        shell: pwsh
        env:
          PUBG_OCR_MODEL_DIR: ${{ runner.temp }}\ocr_models
        run: |
          cargo build --manifest-path rust/Cargo.toml --features cli
          python scripts/run_real_ocr_benchmark.py --executable rust\target\debug\ocr_engine.exe --model-dir $env:PUBG_OCR_MODEL_DIR --output $env:RUNNER_TEMP\real_ocr_report.json
