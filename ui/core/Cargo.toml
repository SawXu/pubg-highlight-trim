[package]
name = "pubg-highlight-trim-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[[bin]]
name = "controlled-cli"
path = "tests/support/controlled_cli.rs"

[dev-dependencies]
tempfile = "3"
csv = "1"
sha2 = "0.10"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_Diagnostics_ToolHelp"] }
